<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>File Sorter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>File Sorter</h1>
    <div class="row">
      <input id="path" type="text" placeholder="Choose a folder..." readonly />
      <button id="browse" type="button">Browse</button>
      <button id="open" type="button" disabled>Open</button>
    </div>
    <div class="row">
      <button id="preview-btn" type="button" disabled>Preview</button>
      <button id="sort" type="button" disabled>Sort files</button>
    </div>
    <div id="preview-box" hidden>
      <p id="preview-summary"></p>
      <ul id="preview-list"></ul>
      <p id="preview-note" class="hint"></p>
    </div>

    <section>
      <h2>Custom groups</h2>
      <p class="hint">
        By default files go into Documents, Images, Audio, Video, Archives,
        Applications, Code, Fonts, eBooks, Subtitles, 3D-CAD, Disk-Images,
        Data, Torrents, and Logs. Add your own folders below to override or
        extend those rules.
      </p>
      <form id="add-group-form">
        <div class="row">
          <input id="group-name" type="text" placeholder="Folder name" />
          <input id="group-exts" type="text" placeholder="Extensions, e.g. pdf, docx" />
        </div>
        <button id="add-group" type="submit" disabled>Add group</button>
      </form>
      <ul id="groups"></ul>
    </section>

    <p id="status" aria-live="polite"></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
